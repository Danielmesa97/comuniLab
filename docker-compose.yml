services:
  sql:
    image: mysql:8.4
    container_name: comuniLab-sql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: habitapp
      MYSQL_USER: habitapp
      MYSQL_PASSWORD: habitapp
    ports:
      - "3306:3306"
    volumes:
      - sql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: comuniLab-phpmyadmin
    restart: unless-stopped
    depends_on:
      sql:
        condition: service_healthy
    environment:
      PMA_HOST: sql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"

  back:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: comuniLab-back
    restart: unless-stopped
    depends_on:
      sql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    ports:
      - "8000:8000"

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comuniLab-front
    restart: unless-stopped
    depends_on:
      - back
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - frontend-node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  sql-data:
  backend-vendor:
  frontend-node_modules:
